global:
  resolve_timeout: 5m
route:
  receiver: gateway-wecom
  group_by: ['alertname','instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: gateway-wecom
    webhook_configs:
      - url: http://ingress:8080/v1/admin/alerts/ingest
        send_resolved: true
        max_alerts: 50
        http_config:
          authorization:
            credentials_file: /run/secrets/admin_token
