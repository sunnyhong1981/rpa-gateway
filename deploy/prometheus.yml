global:
  scrape_interval: 15s
  evaluation_interval: 15s
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: rpa-gateway
    authorization:
      credentials_file: /run/secrets/admin_token
    static_configs:
      - targets: ['gateway-a:8080','gateway-b:8080','media:8080']
