worker_processes auto;
worker_rlimit_nofile 16384;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 4096; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  map $http_upgrade $connection_upgrade { default upgrade; '' ''; }
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream gateways {
    zone gateways 256k;
    least_conn;
    server gateway-a:8080 resolve max_fails=3 fail_timeout=5s;
    server gateway-b:8080 resolve max_fails=3 fail_timeout=5s;
    keepalive 64;
  }
  upstream media { zone media 256k; server media:8080 resolve; keepalive 8; }
  server {
    listen 8080;
    listen 8443 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 256k;
    client_body_timeout 15s;
    keepalive_timeout 30s;
    location ~ ^/v1/backend/[^/]+/media$ {
      client_max_body_size 12m;
      proxy_request_buffering off;
      proxy_pass http://media;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $http_host;
      proxy_read_timeout 30s;
      proxy_next_upstream off;
    }
    location ~ ^/v1/device/tasks/[^/]+/media/[^/]+$ {
      proxy_pass http://media;
      proxy_buffering off;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $http_host;
      proxy_read_timeout 30s;
      proxy_next_upstream off;
    }
    location / {
      proxy_pass http://gateways;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      proxy_read_timeout 90s;
      proxy_send_timeout 15s;
      proxy_connect_timeout 3s;
      # Never retry a POST/receipt/claim implicitly at the reverse proxy.
      proxy_next_upstream off;
    }
  }
  server {
    listen 8444 ssl;
    ssl_certificate /run/tls/cert.pem;
    ssl_certificate_key /run/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 13m;
    access_log off;
    location / {
      proxy_pass http://objects:9000;
      proxy_set_header Host $http_host;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 30s;
      proxy_next_upstream off;
    }
  }
}
